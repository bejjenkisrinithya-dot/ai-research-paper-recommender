<!DOCTYPE html>
<html>

<head>

<title>AI Research Paper Recommender</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:10px;
width:500px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

h1{
margin-bottom:20px;
}

input{
width:80%;
padding:12px;
border-radius:5px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:5px;
background:#2a5298;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1e3c72;
}

.results{
margin-top:25px;
text-align:left;
}

.paper{
background:#f5f5f5;
padding:10px;
margin-bottom:10px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>AI Research Paper Recommender</h1>

<input id="query" placeholder="Enter research topic">

<br>

<button onclick="search()">Search Papers</button>

<div class="results" id="results"></div>

</div>

<script>

function search(){

let query=document.getElementById("query").value

fetch("http://127.0.0.1:5000/recommend",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({query:query})

})

.then(response=>response.json())

.then(data=>{

let html=""

data.forEach(paper=>{

html+=`
<div class="paper">
<b>${paper.title}</b><br>
<a href="${paper.link}" target="_blank">Read Paper</a>
</div>
`

})

document.getElementById("results").innerHTML=html

})

}

</script>

</body>

</html>
